name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build # кладёт в site/version.json коммит этого запуска
      - run: npm run build:worker
      - run: npx wrangler deploy --config worker/wrangler.jsonc
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Квитанция выпуска
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o /tmp/release-receipt.mjs https://github.com/Oleg4311/release-receipt/releases/download/v0.1.0/release-receipt.mjs
          echo "0fd21b9f9be37f4668ef0272027791e734da56a49b1d81054907aad1b3790892  /tmp/release-receipt.mjs" | sha256sum -c
          node /tmp/release-receipt.mjs verify https://passkeys-kit.olegbelii4311.workers.dev/ \
            --sha "${{ github.sha }}" --repo "${{ github.repository }}" --workflow CI \
            --wait 900 --interval 10 --out receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: receipt
          path: receipt.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: e2e на живом адресе (настоящий Chromium с виртуальным аутентификатором)
        env:
          BASE_URL: https://passkeys-kit.olegbelii4311.workers.dev/
        run: npx playwright test --retries=2 --workers=2
