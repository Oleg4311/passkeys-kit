<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход по passkey: без паролей</title>
<meta name="description" content="Вход по passkey (WebAuthn) на Cloudflare Workers: регистрация и вход без пароля, свой разбор CBOR и COSE, сверка с SimpleWebAuthn.">
<meta name="theme-color" content="#0b5cad">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b5cad'/%3E%3Ccircle cx='26' cy='26' r='10' fill='%23fff'/%3E%3Cpath d='M32 34l20 20-6 4-6-6-4 2-4-4z' fill='%23fff'/%3E%3C/svg%3E">
<style>

:root{--bg:#f4f7fb;--card:#fff;--ink:#14202e;--mut:#4a5a6c;--line:#d5dee9;--acc:#0b5cad;--acc-ink:#fff;--water:#dbe9f7;--ship:#5b6f86;--hit:#c0392b;--miss:#8aa0b8;--sunk:#7b1d14;--ok:#1b6e3a;--warn:#fff4d6;--warn-ink:#5c4400;--focus:#1a56db}
@media(prefers-color-scheme:dark){:root{--bg:#0f1722;--card:#17212f;--ink:#eaf0f7;--mut:#b4c2d2;--line:#2b3a4d;--acc:#6db3ff;--acc-ink:#07182b;--water:#1d3049;--ship:#8ea4bd;--hit:#ff7a6b;--miss:#6f86a0;--sunk:#ffb4a9;--ok:#6fdc93;--warn:#3c3213;--warn-ink:#ffe6a3;--focus:#8ab4ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top,main,footer{max-width:760px;margin:0 auto;padding-left:16px;padding-right:16px}
.top{padding-top:20px}
h1{margin:0;font-size:1.7rem;line-height:1.2}
h2{margin:0 0 10px;font-size:1.1rem}
.lead{color:var(--mut);margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.hint{color:var(--mut);font-size:.92rem;margin:0 0 10px}
label{display:block;font-size:.9rem;color:var(--mut);margin:0 0 4px}
input,select{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:46px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.status{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.88rem;background:var(--water)}
.pill.on{color:var(--ok)}
.seats{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.seats li{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.code{font-size:2rem;letter-spacing:.2em;font-weight:800;font-variant-numeric:tabular-nums}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.boards{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:var(--line);border:2px solid var(--line);border-radius:8px;overflow:hidden;max-width:380px;width:100%}
.grid button{aspect-ratio:1;min-height:0;padding:0;border:0;border-radius:0;background:var(--water);font-size:.9rem;line-height:1;color:var(--ink)}
.grid button.ship{background:var(--ship)}
.grid button.miss::after{content:"•";color:var(--miss);font-size:1.3em}
.grid button.hit{background:var(--hit);color:#fff}
.grid button.hit::after{content:"✕"}
.grid button.sunk{background:var(--sunk);color:#fff}
.grid button.reveal{background:var(--ship)}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px;background:var(--acc);padding:8px;border-radius:12px}
.c4 button{aspect-ratio:1;border-radius:50%;min-height:0;padding:0;background:var(--bg);border:0}
.c4 button.p0{background:#f2c200}
.c4 button.p1{background:#e0392b}
.c4 button.win{outline:4px solid #fff}
.colhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px;margin-bottom:4px}
.colhead button{min-height:40px;padding:0}
.banner{padding:10px 14px;border-radius:12px;background:var(--warn);color:var(--warn-ink);margin-bottom:12px}
.banner.win{background:#d6f5df;color:#0f4d26}
@media(prefers-color-scheme:dark){.banner.win{background:#14402a;color:#bff0d0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222;color:#fff;border-radius:999px;padding:10px 18px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}
footer{color:var(--mut);font-size:.88rem;padding-top:6px;padding-bottom:36px}
a{color:var(--acc)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.keys{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:8px}
.keys li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.pill.bad{color:#fff;background:var(--hit)}
</style>
</head>
<body>
<header class="top">
  <h1>Вход по passkey</h1>
  <p class="lead">Без паролей: отпечаток, лицо или PIN устройства. Демо библиотеки passkeys-kit на Cloudflare Workers.</p>
</header>
<main id="app" tabindex="-1"><noscript>Для работы нужен JavaScript.</noscript></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<footer>
  Это демо: аккаунты и ключи лежат на сервере в Durable Object. <a href="https://github.com/Oleg4311/passkeys-kit">Исходный код</a> · Сделано с помощью Claude
</footer>
<script src="app.js"></script>
</body>
</html>
